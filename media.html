<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <h1>Media</h1>
    <h2>My Video</h2>
    <video autoplay loop muted>
        <p>Browser not supported</p>
        <source src="media/video/hero-bg.mp4" type="video/mp4">

    </audio>
</body>
</html>
